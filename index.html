<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mailer</title>
<style>
  :root{
    --blue:#2f6fed;
    --blue-dark:#2158c9;
    --blue-soft:#eaf1ff;
    --blue-softer:#f4f8ff;
    --ink:#1f2433;
    --muted:#8791a8;
    --line:#e6eaf3;
    --bg:#f2f5fb;
    --panel:#ffffff;
    --green:#2f9e6a;
    --red:#e5484d;
    --radius:16px;
    --radius-sm:10px;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:var(--sans);
    color:var(--ink);
  }
  .shell{max-width:660px;margin:0 auto;padding:32px 20px 60px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg, var(--blue), var(--blue-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;
  }
  .brand h1{font-size:18px;margin:0;font-weight:700;}

  .nav{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;box-shadow:0 1px 2px rgba(20,30,60,0.06);}
  .nav button{
    border:none;background:none;padding:9px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
  }
  .nav button.active{background:var(--blue);color:#fff;}

  .panel{
    background:var(--panel);
    border-radius:var(--radius);
    box-shadow:0 2px 10px rgba(30,50,100,0.06);
    padding:26px;
    margin-bottom:16px;
  }

  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;
  }
  input[type=text], input[type=email], textarea{
    width:100%;
    border:1.5px solid transparent;
    background:var(--blue-softer);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input::placeholder, textarea::placeholder{color:#adb6c9;}
  input:focus, textarea:focus{border-color:var(--blue);background:#fff;}

  .cc-link{
    font-size:12.5px;color:var(--blue);font-weight:600;cursor:pointer;
    background:none;border:none;padding:0;margin:-6px 0 14px;display:inline-block;
  }
  .cc-block{display:none;}
  .cc-block.show{display:block;}
  .cc-row{display:flex;gap:10px;}
  .cc-row .field{flex:1;}

  /* custom email dropdown (From / Cc) */
  .combo{position:relative;}
  .combo-menu{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:#fff;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    box-shadow:0 10px 28px rgba(30,50,100,0.16);
    max-height:230px;overflow-y:auto;
    padding:6px;
    z-index:30;
    display:none;
  }
  .combo-menu.show{display:block;}
  .combo-hint{padding:8px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;}
  .combo-option{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:8px;
    font-size:13.5px;color:var(--ink);
    cursor:pointer;
  }
  .combo-option:hover{background:var(--blue-soft);color:var(--blue-dark);}
  .combo-option.selected{color:var(--blue);font-weight:700;background:var(--blue-soft);}
  .combo-check{font-size:12px;color:var(--blue);}
  .combo-empty{padding:9px 12px;font-size:12.5px;color:var(--muted);}

  /* rich text editor */
  .rte{
    border:1.5px solid transparent;
    background:var(--blue-softer);
    border-radius:var(--radius-sm);
    overflow:hidden;
    transition:border-color .15s ease, background .15s ease;
  }
  .rte.focused{border-color:var(--blue);background:#fff;}
  .rte-toolbar{
    display:flex;align-items:center;gap:2px;
    padding:6px 8px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,0.5);
  }
  .rte-btn{
    border:none;background:none;
    width:30px;height:30px;border-radius:7px;
    font-size:13.5px;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .rte-btn:hover{background:var(--blue-soft);}
  .rte-btn.b{font-weight:700;}
  .rte-btn.i{font-style:italic;}
  .rte-btn.u{text-decoration:underline;}
  .rte-sep{width:1px;height:18px;background:var(--line);margin:0 4px;}
  .rte-editor{
    min-height:190px;
    max-height:420px;
    overflow-y:auto;
    padding:12px 14px;
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    outline:none;
  }
  .rte-editor a{color:var(--blue);}
  .rte-editor:empty:before{
    content:attr(data-placeholder);
    color:#adb6c9;
  }

  .attach-area{
    border:1.5px dashed #c7d3ea;
    border-radius:var(--radius-sm);
    padding:18px;
    text-align:center;
    cursor:pointer;
    background:var(--blue-softer);
    transition:background .15s ease, border-color .15s ease;
  }
  .attach-area:hover, .attach-area.drag{background:var(--blue-soft);border-color:var(--blue);}
  .attach-area .icon{font-size:20px;color:var(--blue);}
  .attach-area .txt{font-size:12.5px;color:var(--muted);margin-top:4px;}

  .attach-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--blue-soft);color:var(--blue-dark);
    border-radius:999px;
    padding:6px 8px 6px 14px;
    font-size:12.5px;font-weight:600;
    margin:10px 6px 0 0;
  }
  .attach-chip button{
    border:none;background:#fff;color:var(--blue-dark);
    width:18px;height:18px;border-radius:50%;
    font-size:12px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .send-row{display:flex;align-items:center;justify-content:flex-end;margin-top:4px;}
  .send-btn{
    background:var(--blue);
    color:#fff;
    border:none;
    padding:13px 28px;
    border-radius:999px;
    font-size:14.5px;font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(47,111,237,0.35);
    transition:background .15s ease, transform .06s ease;
  }
  .send-btn:hover{background:var(--blue-dark);}
  .send-btn:active{transform:translateY(1px);}
  .send-btn:disabled{background:#b9c6e6;box-shadow:none;cursor:not-allowed;}

  .banner{
    display:none;
    border-radius:var(--radius-sm);
    padding:13px 16px;
    font-size:13.5px;
    margin-top:14px;
    line-height:1.5;
  }
  .banner.show{display:block;}
  .banner.ok{background:#e9f8f0;color:#1e7a4f;}
  .banner.err{background:#fdecec;color:#b93235;}

  /* history */
  .hist-item{
    background:var(--panel);
    border-radius:var(--radius);
    box-shadow:0 2px 10px rgba(30,50,100,0.06);
    padding:16px 20px;
    margin-bottom:12px;
    cursor:pointer;
    transition:box-shadow .15s ease, transform .06s ease;
  }
  .hist-item:hover{box-shadow:0 4px 16px rgba(30,50,100,0.12);}
  .hist-item:active{transform:translateY(1px);}
  .hist-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .hist-subject{font-weight:700;font-size:14.5px;}
  .hist-time{font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .hist-to{font-size:13px;color:var(--muted);margin-top:4px;}
  .hist-badge{
    display:inline-block;margin-top:8px;
    font-size:11px;font-weight:700;
    padding:3px 10px;border-radius:999px;
  }
  .hist-badge.ok{background:#e9f8f0;color:#1e7a4f;}
  .hist-badge.err{background:#fdecec;color:#b93235;}
  .hist-reuse{
    display:inline-block;margin-top:8px;margin-left:8px;
    font-size:11px;font-weight:700;color:var(--blue);
  }
  .empty{
    text-align:center;color:var(--muted);font-size:13.5px;padding:50px 20px;
  }
  .empty .icon{font-size:30px;margin-bottom:10px;}

  .clear-hist{
    display:block;margin:0 auto;
    background:none;border:none;color:var(--muted);
    font-size:12.5px;text-decoration:underline;cursor:pointer;
    padding:10px;
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <h1>Mailer</h1>
    </div>
    <div class="nav">
      <button id="navCompose" class="active">Compose</button>
      <button id="navHistory">History</button>
    </div>
  </div>

  <!-- Compose view -->
  <div id="composeView">
    <div class="panel">
      <div class="field">
        <label>From</label>
        <div class="combo" id="fromCombo">
          <input type="text" id="fromField" placeholder="you@yourdomain.com" autocomplete="off">
          <div class="combo-menu" id="fromMenu"></div>
        </div>
      </div>

      <div class="field">
        <label>To</label>
        <input type="text" id="toField" placeholder="name@example.com">
      </div>

      <button type="button" class="cc-link" id="ccToggle">− Cc / Bcc</button>
      <div class="cc-block show" id="ccBlock">
        <div class="cc-row">
          <div class="field">
            <label>Cc</label>
            <div class="combo" id="ccCombo">
              <input type="text" id="ccField" placeholder="cc@example.com, another@example.com" autocomplete="off">
              <div class="combo-menu" id="ccMenu"></div>
            </div>
          </div>
          <div class="field">
            <label>Bcc</label>
            <input type="text" id="bccField" placeholder="bcc@example.com, another@example.com">
          </div>
        </div>
      </div>

      <div class="field">
        <label>Subject</label>
        <input type="text" id="subjectField" placeholder="Write a subject">
      </div>

      <div class="field">
        <label>Message</label>
        <div class="rte" id="rte">
          <div class="rte-toolbar">
            <button type="button" class="rte-btn b" data-cmd="bold" title="Bold">B</button>
            <button type="button" class="rte-btn i" data-cmd="italic" title="Italic">I</button>
            <button type="button" class="rte-btn u" data-cmd="underline" title="Underline">U</button>
            <span class="rte-sep"></span>
            <button type="button" class="rte-btn" data-cmd="insertUnorderedList" title="Bulleted list">&#8226;&#8226;&#8226;</button>
            <button type="button" class="rte-btn" data-cmd="insertOrderedList" title="Numbered list">1.</button>
            <span class="rte-sep"></span>
            <button type="button" class="rte-btn" data-cmd="link" title="Insert link">&#128279;</button>
            <button type="button" class="rte-btn" data-cmd="unlink" title="Remove link">&#128279;&#8260;</button>
            <span class="rte-sep"></span>
            <button type="button" class="rte-btn" data-cmd="removeFormat" title="Clear formatting">Tx</button>
          </div>
          <div class="rte-editor" id="bodyField" contenteditable="true" data-placeholder="Write your message here..."></div>
        </div>
      </div>

      <div class="field">
        <label>Attachments</label>
        <div class="attach-area" id="dropZone">
          <div class="icon">📎</div>
          <div class="txt">Click to attach files, or drag & drop</div>
          <input type="file" id="fileInput" multiple style="display:none;">
        </div>
        <div id="attachChips"></div>
      </div>

      <div class="send-row">
        <button type="button" class="send-btn" id="sendBtn">Send</button>
      </div>

      <div class="banner" id="banner"></div>
    </div>
  </div>

  <!-- History view -->
  <div id="historyView" style="display:none;">
    <div id="historyList"></div>
    <button type="button" class="clear-hist" id="clearHist" style="display:none;">Clear history</button>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  // Remembers the last "From" address used, so it doesn't need retyping each time
  const savedFrom = localStorage.getItem('mailer_from');
  if (savedFrom) $('fromField').value = savedFrom;
  $('fromField').addEventListener('input', () => {
    localStorage.setItem('mailer_from', $('fromField').value.trim());
  });

  // ---- nav ----
  const navCompose = $('navCompose'), navHistory = $('navHistory');
  const composeView = $('composeView'), historyView = $('historyView');
  navCompose.addEventListener('click', () => showView('compose'));
  navHistory.addEventListener('click', () => showView('history'));
  function showView(v){
    const isCompose = v === 'compose';
    navCompose.classList.toggle('active', isCompose);
    navHistory.classList.toggle('active', !isCompose);
    composeView.style.display = isCompose ? 'block' : 'none';
    historyView.style.display = isCompose ? 'none' : 'block';
    if (!isCompose) renderHistory();
  }

  // ---- custom email dropdown (From: single-select, Cc: multi-select via comma list) ----
  const KNOWN_EMAILS = [
    'hanzalah@xperiode.com',
    'billing@xperiode.com',
    'connect@xperiode.com',
    'lisa@xperiode.com',
    'onboarding@xperiode.com',
    'support@xperiode.com'
  ];

  function setupEmailCombo(inputId, menuId, multi, opts){
    opts = opts || {};
    const labelFor = opts.labelFor || (e => e);
    const formatSelect = opts.formatSelect || (e => e);
    const input = $(inputId), menu = $(menuId);

    function tokens(){
      return input.value.split(',').map(s => s.trim()).filter(Boolean);
    }
    // text typed after the last comma (or the whole value for single-select) — used to filter options
    function activeFilter(){
      if (!multi) return input.value.trim();
      const parts = input.value.split(',');
      return parts[parts.length - 1].trim();
    }

    function render(){
      const q = activeFilter().toLowerCase();
      const selected = multi ? tokens() : [];
      const matches = KNOWN_EMAILS.filter(e => e.toLowerCase().includes(q));

      let html = '<div class="combo-hint">Your addresses</div>';
      if (matches.length){
        html += matches.map(e => `
          <div class="combo-option ${selected.includes(e) ? 'selected' : ''}" data-email="${e}">
            <span>${labelFor(e)}</span>
            ${selected.includes(e) ? '<span class="combo-check">✓</span>' : ''}
          </div>
        `).join('');
      } else {
        html += '<div class="combo-empty">No match — keep typing to use this address</div>';
      }
      menu.innerHTML = html;
      menu.classList.add('show');
    }

    input.addEventListener('focus', render);
    input.addEventListener('input', render);
    input.addEventListener('blur', () => {
      // delay so a click on an option registers before the menu closes
      setTimeout(() => menu.classList.remove('show'), 150);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') menu.classList.remove('show');
    });

    // keep the input focused when a menu option is pressed
    menu.addEventListener('mousedown', e => e.preventDefault());
    menu.addEventListener('click', e => {
      const opt = e.target.closest('.combo-option');
      if (!opt) return;
      const email = opt.dataset.email;

      if (multi){
        let list = tokens();
        if (list.includes(email)){
          list = list.filter(t => t !== email);
        } else {
          list.push(email);
        }
        input.value = list.length ? list.join(', ') + ', ' : '';
        render();
        input.focus();
      } else {
        input.value = formatSelect(email);
        menu.classList.remove('show');
      }
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
  }

  setupEmailCombo('fromField', 'fromMenu', false, {
    labelFor: e => `Xperiode <${e}>`,
    formatSelect: e => `Xperiode <${e}>`
  });
  setupEmailCombo('ccField', 'ccMenu', true);

  // ---- cc/bcc toggle (open by default) ----
  $('ccToggle').addEventListener('click', () => {
    const block = $('ccBlock');
    block.classList.toggle('show');
    $('ccToggle').textContent = block.classList.contains('show') ? '− Cc / Bcc' : '+ Cc / Bcc';
  });

  // ---- rich text editor ----
  const rte = $('rte'), bodyField = $('bodyField');
  bodyField.addEventListener('focus', () => rte.classList.add('focused'));
  bodyField.addEventListener('blur', () => rte.classList.remove('focused'));

  document.querySelectorAll('.rte-btn').forEach(btn => {
    // mousedown (not click) + preventDefault keeps the text selection alive,
    // otherwise the editor loses focus/selection before the command runs
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      const cmd = btn.dataset.cmd;
      bodyField.focus();
      if (cmd === 'link'){
        const url = window.prompt('Link URL:', 'https://');
        if (url) document.execCommand('createLink', false, url);
      } else {
        document.execCommand(cmd, false, null);
      }
    });
  });

  // ---- attachments ----
  const dropZone = $('dropZone'), fileInput = $('fileInput'), attachChips = $('attachChips');
  let attachments = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function handleFiles(fileList){
    Array.from(fileList).forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        attachments.push({
          Name: file.name,
          Content: reader.result.split(',')[1],
          ContentType: file.type || 'application/octet-stream'
        });
        renderChips();
      };
      reader.readAsDataURL(file);
    });
    fileInput.value = '';
  }

  function renderChips(){
    attachChips.innerHTML = '';
    attachments.forEach((a, i) => {
      const chip = document.createElement('span');
      chip.className = 'attach-chip';
      chip.innerHTML = escapeHtml(a.Name) + ' <button type="button">×</button>';
      chip.querySelector('button').addEventListener('click', () => {
        attachments.splice(i, 1);
        renderChips();
      });
      attachChips.appendChild(chip);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- history (localStorage) ----
  const HIST_KEY = 'mailer_history';
  function loadHistory(){
    try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveHistoryEntry(entry){
    const list = loadHistory();
    list.unshift(entry);
    localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 100)));
  }
  function renderHistory(){
    const list = loadHistory();
    const container = $('historyList');
    const clearBtn = $('clearHist');
    if (!list.length){
      container.innerHTML = '<div class="empty"><div class="icon">✉️</div>No emails sent yet.</div>';
      clearBtn.style.display = 'none';
      return;
    }
    clearBtn.style.display = 'block';
    container.innerHTML = list.map((item, i) => `
      <div class="hist-item" data-idx="${i}">
        <div class="hist-top">
          <div class="hist-subject">${escapeHtml(item.subject || '(no subject)')}</div>
          <div class="hist-time">${item.time}</div>
        </div>
        <div class="hist-to">To: ${escapeHtml(item.to)}</div>
        <span class="hist-badge ${item.ok ? 'ok' : 'err'}">${item.ok ? 'Sent' : 'Failed'}</span>
        <span class="hist-reuse">Click to reuse ›</span>
      </div>
    `).join('');

    container.querySelectorAll('.hist-item').forEach(el => {
      el.addEventListener('click', () => {
        const item = list[Number(el.dataset.idx)];
        applyHistoryEntry(item);
      });
    });
  }
  $('clearHist').addEventListener('click', (e) => {
    e.stopPropagation();
    localStorage.removeItem(HIST_KEY);
    renderHistory();
  });

  // fills the composer with a past email so it can be reused/edited and re-sent
  function applyHistoryEntry(item){
    $('fromField').value = item.from || '';
    $('toField').value = item.to || '';
    $('ccField').value = item.cc || '';
    $('bccField').value = item.bcc || '';
    $('subjectField').value = item.subject || '';
    bodyField.innerHTML = item.bodyHtml || '';
    if (item.cc || item.bcc) {
      $('ccBlock').classList.add('show');
      $('ccToggle').textContent = '− Cc / Bcc';
    }
    showView('compose');
  }

  // ---- send ----
  const banner = $('banner');
  $('sendBtn').addEventListener('click', async () => {
    const from = $('fromField').value.trim();
    const to = $('toField').value.trim();
    const subject = $('subjectField').value.trim();
    const bodyHtml = bodyField.innerHTML;
    const bodyText = bodyField.innerText;

    banner.className = 'banner';
    if (!from || !to || !subject){
      banner.className = 'banner show err';
      banner.textContent = 'Please fill in From, To, and Subject before sending.';
      return;
    }

    const payload = {
      from: from,
      to: to,
      subject: subject,
      body: bodyText,
      htmlBody: bodyHtml
    };
    const cc = $('ccField').value.trim();
    const bcc = $('bccField').value.trim();
    if (cc) payload.cc = cc;
    if (bcc) payload.bcc = bcc;
    if (attachments.length) payload.attachments = attachments;

    const btn = $('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    let ok = false, message = '';
    try{
      const res = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok && data.ErrorCode === 0){
        ok = true;
        message = 'Your email was sent successfully.';
      } else {
        message = data.Message || 'Something went wrong sending this email.';
      }
    }catch(e){
      message = 'Could not reach the server. Check your connection and try again.';
    }

    banner.className = 'banner show ' + (ok ? 'ok' : 'err');
    banner.textContent = ok ? '✓ ' + message : '✗ ' + message;

    saveHistoryEntry({
      from: from,
      to: to,
      cc: cc,
      bcc: bcc,
      subject: subject,
      bodyHtml: bodyHtml,
      ok: ok,
      time: new Date().toLocaleString()
    });

    btn.disabled = false;
    btn.textContent = 'Send';

    if (ok){
      $('toField').value = '';
      $('subjectField').value = '';
      bodyField.innerHTML = '';
      $('ccField').value = '';
      $('bccField').value = '';
      attachments = [];
      renderChips();
    }
  });
})();
</script>
</body>
</html>
